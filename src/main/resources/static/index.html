<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
<div class="container">
    <h2 class="mb-3">Communication WebSocket Client ↔ Serveur</h2>

    <div class="mb-3">
        <input type="text" id="messageInput" class="form-control" placeholder="Tapez un message...">
    </div>
    <button class="btn btn-primary" id="sendBtn">Envoyer</button>

    <hr>
    <h4>Messages :</h4>
    <div id="chatBox" class="border rounded p-3" style="height:200px; overflow-y:auto;"></div>
</div>

<script>
    const chatBox = document.getElementById("chatBox");
    const ws = new WebSocket("ws://localhost:8080/ws");

    ws.onopen = () => appendMessage("✅ Connecté au serveur WebSocket");
    ws.onmessage = (event) => appendMessage("🖥️ " + event.data);
    ws.onclose = () => appendMessage("❌ Déconnecté du serveur");

    document.getElementById("sendBtn").addEventListener("click", () => {
        const input = document.getElementById("messageInput");
        const message = input.value;
        if (message.trim() !== "") {
            ws.send(message);
            appendMessage("👤 " + message);
            input.value = "";
        }
    });

    function appendMessage(msg) {
        const p = document.createElement("p");
        p.textContent = msg;
        chatBox.appendChild(p);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
